<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HW2 Player Card</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Agency+FB&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: 'Agency FB', sans-serif;
        }

        #app {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .card {
            width: 450px;
            height: 150px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.9) 0%, rgba(20, 20, 20, 0.95) 100%);
            border: 2px solid #fff;
            border-radius: 4px;
            /* Slight round */
            display: flex;
            position: absolute;
            /* Absolute positioning handled by JS */
            overflow: visible;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);

            /* Initial state hidden */
            opacity: 0;
            transform: scale(0.9);
        }

        /* Skewed decorative element */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin: 3px;
            pointer-events: none;
        }

        .leader-port {
            width: 140px;
            height: 100%;
            position: relative;
            overflow: hidden;
            border-right: 2px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .leader-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* object-position: center top; */
        }

        .info {
            flex: 1;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            min-width: 0;
            /* Prevention flex overflow */
        }

        .p-name {
            font-size: 27px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .detail-row {
            display: flex;
            align-items: center;
            font-size: 19px;
            margin: 1px 0;
            color: #ddd;
            width: 100%;
            column-gap: 15px;
            /* Add gap between label and value */
        }

        .label {
            color: #aaa;
            width: auto;
            min-width: 60px;
            font-size: 13px;
            text-transform: uppercase;
            flex-shrink: 0;
            text-align: left;
            white-space: nowrap;
        }

        .val {
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rank-val {
            color: #ffcccc;
            /* Slight tint */
        }

        /* Animation classes handled by GSAP */
    </style>
</head>

<body>

    <div id="app">
        <!-- Template Card -->
        <div class="card" id="card-template" style="display: none;">
            <div class="leader-port">
                <img class="leader-img" src="" onerror="this.src='leaders/Atriox.svg'">
            </div>
            <div class="info">
                <div class="p-name">JUGADOR</div>
                <div class="detail-row">
                    <span class="label lbl-rank">Rango en 1v1</span>
                    <span class="val rank-val p-rank">Onyx 1500</span>
                </div>
                <div class="detail-row">
                    <span class="label">MMR</span>
                    <span class="val p-mmr">1500</span>
                </div>
                <div class="detail-row">
                    <span class="label">Estilo de juego</span>
                    <span class="val p-style">Aggressive</span>
                </div>
                <div class="detail-row">
                    <span class="label">Líder</span>
                    <span class="val p-leader">Atriox</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const app = document.getElementById('app');
        const template = document.getElementById('card-template');

        // Store Active Cards by Slot
        const fileteredCards = {}; // slot -> { element, timer, exitX }

        let ws;

        function connect() {
            ws = new WebSocket('ws://localhost:7305');
            ws.onopen = () => console.log("Connected to Control");
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'show_card') {
                    showCard(msg.data);
                }
            };
            ws.onclose = () => setTimeout(connect, 3000);
        }

        connect();

        function showCard(data) {
            const slot = data.slot || 1;
            const teamSize = data.team_size || 1;
            const side = data.side || 'left';

            // Get or Create Card Element
            let cardEl;
            let isNew = false;

            if (fileteredCards[slot] && fileteredCards[slot].element) {
                cardEl = fileteredCards[slot].element;
                // Kill existing animations
                gsap.killTweensOf(cardEl);
                if (fileteredCards[slot].timer) clearTimeout(fileteredCards[slot].timer);
            } else {
                cardEl = template.cloneNode(true);
                cardEl.id = `card-${slot}`;
                cardEl.style.display = 'flex';
                app.appendChild(cardEl);
                fileteredCards[slot] = { element: cardEl };
                isNew = true;
            }

            // 1. Update Content
            cardEl.querySelector('.p-name').innerText = data.name || "Unknown";
            cardEl.querySelector('.p-rank').innerText = data.rank || "-";
            cardEl.querySelector('.p-mmr').innerText = data.mmr || "-";
            cardEl.querySelector('.p-style').innerText = data.playstyle || "-";
            cardEl.querySelector('.p-leader').innerText = data.main_leader || "-";

            // Update rank label with game type
            const gameType = `${teamSize}v${teamSize}`;
            cardEl.querySelector('.lbl-rank').innerText = `Rango en ${gameType}`;

            // Update Image
            const imgEl = cardEl.querySelector('.leader-img');
            let leaderFile = (data.main_leader || "Atriox").replace(/ /g, '_');
            imgEl.src = `leaders/${leaderFile}.svg`;
            imgEl.onerror = () => {
                if (imgEl.src.endsWith('.svg')) imgEl.src = imgEl.src.replace('.svg', '.png');
            };

            // 2. Position Logic
            let startX = -50;
            const detailRows = cardEl.querySelectorAll('.detail-row');
            const info = cardEl.querySelector('.info');
            const port = cardEl.querySelector('.leader-port');

            // --- Side Specific Styling (Center Spine logic) ---
            if (side === 'right') {
                cardEl.style.left = 'auto';
                cardEl.style.right = '50px';
                cardEl.style.flexDirection = 'row-reverse';
                cardEl.style.transformOrigin = 'center right';

                info.style.alignItems = 'center';
                info.style.textAlign = 'center';

                port.style.borderRight = 'none';
                port.style.borderLeft = '2px solid rgba(255,255,255,0.1)';

                detailRows.forEach(row => {
                    row.style.flexDirection = 'row';
                    row.style.justifyContent = 'center';

                    const label = row.querySelector('.label');
                    const val = row.querySelector('.val');

                    if (label) {
                        label.style.textAlign = 'right';
                        label.style.width = '45%';
                        label.style.marginRight = '5px';
                    }
                    if (val) {
                        val.style.textAlign = 'left';
                        val.style.width = '45%';
                        val.style.marginLeft = '5px';
                    }
                });
                startX = 50;
            } else {
                // Left Side
                cardEl.style.left = '50px';
                cardEl.style.right = 'auto';
                cardEl.style.flexDirection = 'row';
                cardEl.style.transformOrigin = 'center left';

                info.style.alignItems = 'flex-start';
                info.style.textAlign = 'left';

                port.style.borderLeft = 'none';
                port.style.borderRight = '2px solid rgba(255,255,255,0.1)';

                detailRows.forEach(row => {
                    row.style.flexDirection = 'row';
                    row.style.justifyContent = 'flex-start';

                    const label = row.querySelector('.label');
                    const val = row.querySelector('.val');
                    if (label) {
                        label.style.textAlign = 'left';
                        label.style.width = '60px'; // Reset
                        label.style.marginRight = '0';
                    }
                    if (val) {
                        val.style.textAlign = 'left';
                        val.style.width = 'auto'; // Reset
                        val.style.marginLeft = '0';
                    }
                });
                startX = -50;
            }

            // --- Vertical Positioning ---
            // 1v1: Centered (50%)
            // 2v2/3v3: Stacked
            let topPos = '50%';
            let marginTop = '-75px'; // Half height of 150px card

            if (teamSize > 1) {
                // Stack Logic
                // Slot 1, 2 = Top
                // Slot 3, 4 = Mid
                // Slot 5, 6 = Bot
                if (slot == 1 || slot == 2) {
                    topPos = '35%';
                } else if (slot == 3 || slot == 4) {
                    topPos = '55%';
                } else if (slot == 5 || slot == 6) {
                    topPos = '75%';
                }
                // Adjust margin if needed, but centering on % is fine if we use transform
                // But transform is used for scale animation.
                // We'll set top and use margin-top to center the card itself vertically relative to that %
            }

            cardEl.style.top = topPos;
            cardEl.style.marginTop = marginTop;

            // Store exit direction
            fileteredCards[slot].exitX = startX;

            // 3. Animate In
            // If new or previously hidden
            if (isNew || cardEl.style.opacity == 0) {
                gsap.set(cardEl, { x: startX, opacity: 0, scale: 0.9 });
            }

            gsap.to(cardEl, {
                duration: 0.5,
                opacity: 1,
                x: 0,
                scale: 1,
                ease: "back.out(1.2)"
            });

            // 4. Auto Hide
            fileteredCards[slot].timer = setTimeout(() => hideCard(slot), 8000);
        }

        function hideCard(slot) {
            const cardObj = fileteredCards[slot];
            if (!cardObj || !cardObj.element) return;

            gsap.to(cardObj.element, {
                duration: 0.4,
                opacity: 0,
                x: cardObj.exitX,
                scale: 0.9,
                ease: "power2.in",
                onComplete: () => {
                    // We could remove the element to keep DOM clean, but reusing is fine
                    // app.removeChild(cardObj.element);
                    // delete fileteredCards[slot];
                }
            });
        }
    </script>
</body>

</html>
