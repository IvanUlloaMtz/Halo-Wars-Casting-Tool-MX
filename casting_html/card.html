<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>HW2 Player Card</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="src/css/card.css">
</head>
<body>
    <div id="app">
        <div class="card" id="card-template" style="display: none;">
            <div class="leader-port"><img class="leader-img" src=""></div>
            <div class="info">
                <div class="p-name">-</div>
                <div class="detail-row"><span class="label lbl-rank">Rango</span><span class="val rank-val p-rank">-</span></div>
                <div class="detail-row"><span class="label">MMR</span><span class="val p-mmr">-</span></div>
                <div class="detail-row"><span class="label">Estilo</span><span class="val p-style">-</span></div>
                <div class="detail-row"><span class="label">Líder</span><span class="val p-leader">-</span></div>
            </div>
        </div>
    </div>
    <script src="src/js/card.js"></script>
</body>
</html>
