<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>HW2 Score Overlay</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@6.6.6/css/flag-icons.min.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background-color: transparent;
      /* For OBS */
      font-family: 'Teko', sans-serif;
      text-transform: uppercase;
    }

    /* Container for the scoreboard */
    #scoreboard {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      /* Center the score blocks */
      align-items: stretch;
      /* Width is now auto based on center content only */
      width: auto;
      min-height: 60px;
      height: auto;
      /* Filter applied here might clip absolute children if not careful.
         Let's apply drop-shadow to children or ensure container doesn't clip.
         Actually, standard overflow is visible by default. */
      filter: drop-shadow(0px 5px 5px rgba(0, 0, 0, 0.5));
      visibility: hidden;
    }

    /* Global Border Overlay Container */
    .global-border-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: skewX(-20deg);
      /* Match block skew */
      pointer-events: none;
      z-index: 50;
    }

    /* Common skewed block style */
    .block {
      position: relative;
      transform: skewX(-20deg);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, 0.1);
      overflow: visible;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.25);
    }

    /* Un-skew content inside */
    .content {
      transform: skewX(20deg);
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Player 1 (Left - Red) - Absolute Wing */
    /* Player 1 (Left - Red) - Absolute Wing */
    .p1-side {
      position: absolute;
      right: 100%;
      top: 0;
      bottom: 0;
      width: auto;
      white-space: nowrap;

      background: rgba(160, 0, 0, 0.15);
      border: 2px solid #cc2222;
      border-right: none;
      color: white;
      padding-right: 30px;
      padding-left: 50px;
      margin-right: -2px;
      z-index: 1;

      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    /* Player 2 (Right - Blue) - Absolute Wing */
    /* Player 2 (Right - Blue) - Absolute Wing */
    .p2-side {
      position: absolute;
      left: 100%;
      top: 0;
      bottom: 0;
      width: auto;
      white-space: nowrap;

      background: rgba(0, 0, 160, 0.15);
      border: 2px solid #2244cc;
      border-left: none;
      color: white;
      padding-left: 30px;
      padding-right: 50px;
      margin-left: -2px;
      z-index: 1;

      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    /* Score Blocks (Center) - Transparent with team-colored borders */
    .score-block {
      min-width: 50px;
      width: auto;
      padding: 0 15px;
      z-index: 2;
      background: rgba(0, 0, 0, 0.25);
      border: 2px solid var(--team-color, #fff);
      position: relative;
      overflow: visible;
    }

    /* SVG border-trace overlay inside score blocks */
    /* SVG border-trace overlay inside score blocks */
    .border-trace-svg {
      position: absolute;
      top: -2px;
      left: -2px;
      width: calc(100% + 4px);
      /* Overlap border */
      height: calc(100% + 4px);
      pointer-events: none;
      z-index: 11;
      overflow: visible;
    }

    .border-trace-svg rect {
      fill: none;
      stroke: var(--team-color, #fff);
      stroke-width: 3;
      stroke-dasharray: 20 40;
      stroke-dashoffset: 0;
      filter: drop-shadow(0 0 4px var(--team-color, #fff));
      /* Animation handled by GSAP for uniform speed */
    }

    /* Gap Spacer */
    .timer-gap {
      width: 120px;
      background: transparent;
      z-index: 0;
      flex-shrink: 0;
    }

    .player-entry {
      position: relative;
      margin-bottom: 25px;
      /* Added spacing for overlap */
      margin-top: 15px;
    }



    .player-name,
    .leader-name,
    .player-color-bar {
      position: relative;
      z-index: 5;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    /* Typography */
    .player-name {
      font-size: 25px;
      font-weight: 700;
      line-height: 1;
      text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.8);
      letter-spacing: 1px;
      margin: 0 5px;
      /* Minimal margin in horizontal flow */
    }

    .leader-name {
      font-size: 17px;
      font-weight: 400;
      color: #ddd;
      margin-top: -2px;
      letter-spacing: 1px;
    }

    /* Player Color Bar - under leader name */
    .player-color-bar {
      height: 3px;
      width: 100%;
      margin-top: 0px;
      border-radius: 2px;
      box-shadow: 0 0 4px currentColor;
      animation: color-bar-glow 2s ease-in-out infinite alternate;
    }

    /* Flags */
    .fi {
      background-size: cover;
      background-position: center;
      width: 30px;
      height: 22px;
      display: inline-block;
      margin: 0 10px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    @keyframes color-bar-glow {
      0% {
        filter: brightness(1) drop-shadow(0 0 2px currentColor);
        box-shadow: 0 0 4px currentColor;
      }

      100% {
        filter: brightness(1.5) drop-shadow(0 0 8px currentColor);
        box-shadow: 0 0 10px currentColor, 0 0 4px currentColor;
      }
    }

    /* =========================================
       CSS ANIMATIONS (Robust & Visible)
       ========================================= */

    /* 1. Pulse Wave Effect - Expands from center outward */
    .pulse-wave-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      z-index: 10;
      pointer-events: none;
    }

    .pulse-wave {
      position: absolute;
      top: 0;
      left: 50%;
      width: 0;
      height: 100%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.2), transparent);
      animation: pulse-wave-expand 5s ease-out infinite;
    }

    .pulse-wave:nth-child(2) {
      animation-delay: 2.5s;
    }

    @keyframes pulse-wave-expand {
      0% {
        width: 0;
        opacity: 0.9;
      }

      50% {
        width: 800%;
        opacity: 0.15;
      }

      100% {
        width: 800%;
        opacity: 0;
      }
    }

    /* Match History Indicators */
    .team-history {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%) skewX(20deg);
      display: flex;
      gap: 6px;
      z-index: 5;
      padding: 3px 8px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 0 0 5px 5px;
    }

    /* P1 History (Centered under wing) */
    #p1-history {
      flex-direction: row;
    }

    /* P2 History (Centered under wing) */
    #p2-history {
      flex-direction: row;
    }

    .h-ind {
      width: 12px;
      height: 8px;
      background: #333;
      border: 1px solid #555;
      transform: skewX(-20deg);
      /* Skew to match theme */
    }

    /* Colors */
    .h-ind.win {
      background: #00ff00;
      border-color: #fff;
      animation: h-ind-pulse-win 2s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    .h-ind.win::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
      animation: h-sweep 2.5s ease-in-out infinite;
    }

    .h-ind.loss {
      background: #cc0000;
      border-color: #777;
      opacity: 0.9;
      animation: h-ind-pulse-loss 2.2s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    .h-ind.loss::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 100, 100, 0.5), transparent);
      animation: h-sweep 3s ease-in-out infinite;
    }

    @keyframes h-ind-pulse-win {
      0% {
        box-shadow: 0 0 3px #00ff00;
        transform: skewX(-20deg) scale(1);
        background: #00cc00;
      }

      25% {
        box-shadow: 0 0 12px #00ff00, 0 0 4px #88ff88;
        transform: skewX(-20deg) scale(1.15);
        background: #00ff44;
      }

      50% {
        box-shadow: 0 0 6px #00ff00, 0 0 20px rgba(0, 255, 0, 0.3);
        transform: skewX(-20deg) scale(1.05);
        background: #00ff00;
      }

      75% {
        box-shadow: 0 0 14px #44ff44, 0 0 6px #aaffaa;
        transform: skewX(-20deg) scale(1.2);
        background: #33ff33;
      }

      100% {
        box-shadow: 0 0 3px #00ff00;
        transform: skewX(-20deg) scale(1);
        background: #00cc00;
      }
    }

    @keyframes h-ind-pulse-loss {
      0% {
        box-shadow: 0 0 2px #cc0000;
        transform: skewX(-20deg) scale(1);
        background: #aa0000;
      }

      30% {
        box-shadow: 0 0 10px #ff0000, 0 0 4px #ff4444;
        transform: skewX(-20deg) scale(1.1);
        background: #dd0000;
      }

      60% {
        box-shadow: 0 0 5px #cc0000, 0 0 15px rgba(255, 0, 0, 0.25);
        transform: skewX(-20deg) scale(1.05);
        background: #cc0000;
      }

      100% {
        box-shadow: 0 0 2px #cc0000;
        transform: skewX(-20deg) scale(1);
        background: #aa0000;
      }
    }

    @keyframes h-sweep {
      0% {
        left: -100%;
      }

      40% {
        left: 200%;
      }

      100% {
        left: 200%;
      }
    }

    .h-ind.tbd {
      background: #444;
      border: 1px solid #777;
      opacity: 0.8;
      animation: h-ind-pulse-tbd 3s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    .h-ind.tbd::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      animation: h-sweep 4s ease-in-out infinite;
      animation-delay: 1s;
      /* Stagger slightly */
    }

    @keyframes h-ind-pulse-tbd {
      0% {
        box-shadow: 0 0 2px #555;
        transform: skewX(-20deg) scale(1);
        background: #444;
        border-color: #666;
      }

      50% {
        box-shadow: 0 0 8px #999, 0 0 2px #fff;
        transform: skewX(-20deg) scale(1.05);
        background: #666;
        border-color: #aaa;
      }

      100% {
        box-shadow: 0 0 2px #555;
        transform: skewX(-20deg) scale(1);
        background: #444;
        border-color: #666;
      }
    }

    /* Flash animation for newly determined results */
    @keyframes h-ind-flash-win {
      0% {
        background: #fff;
        box-shadow: 0 0 14px #00ff00, 0 0 30px #00ff00;
        transform: skewX(-20deg) scale(1.6);
      }

      30% {
        background: #88ff88;
        box-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
        transform: skewX(-20deg) scale(1.3);
      }

      100% {
        background: #00ff00;
        box-shadow: 0 0 5px #00ff00;
        transform: skewX(-20deg) scale(1);
      }
    }

    @keyframes h-ind-flash-loss {
      0% {
        background: #fff;
        box-shadow: 0 0 14px #ff0000, 0 0 30px #ff0000;
        transform: skewX(-20deg) scale(1.6);
      }

      30% {
        background: #ff6666;
        box-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
        transform: skewX(-20deg) scale(1.3);
      }

      100% {
        background: #cc0000;
        box-shadow: 0 0 3px #cc0000;
        transform: skewX(-20deg) scale(1);
      }
    }

    .h-ind.win.flash {
      animation: h-ind-flash-win 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .h-ind.loss.flash {
      animation: h-ind-flash-loss 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 2. Container Breathing (Dynamic Feel) */
    /* Applied to .center-score blocks or main container if desired */
    .dynamic-pulse {
      animation: breathe-anim 3s infinite ease-in-out;
    }

    @keyframes breathe-anim {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.02);
      }
    }

    /* 3. Game Type Indicator Glow */
    .glow-border {
      animation: border-glow 2s infinite alternate;
    }

    @keyframes border-glow {
      from {
        box-shadow: 0 0 5px rgba(237, 175, 34, 0.4);
        border-color: #edaf22;
      }

      to {
        box-shadow: 0 0 15px rgba(237, 175, 34, 1);
        border-color: #fff;
      }
    }

    /* Series Winner Animation */
    @keyframes winner-pulse {
      0% {
        box-shadow: 0 0 10px #ffd700;
        border-color: #ffd700;
      }

      50% {
        box-shadow: 0 0 30px #ffd700, 0 0 10px white;
        border-color: white;
      }

      100% {
        box-shadow: 0 0 10px #ffd700;
        border-color: #ffd700;
      }
    }

    .series-win {
      animation: winner-pulse 1.5s infinite;
      z-index: 15 !important;
    }

    .winner-label {
      position: absolute;
      bottom: 100%;
      /* Position above the block */
      left: 50%;
      transform: translateX(-50%) skewX(20deg);
      background: linear-gradient(90deg, #c9902a, #ffd700, #c9902a);
      color: #000;
      padding: 3px 15px;
      font-weight: 800;
      font-size: 16px;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 0 15px #ffd700;
      z-index: 50;
      border-radius: 3px 3px 0 0;
    }

    .series-win .winner-label {
      opacity: 1;
      animation: bounce-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes bounce-in {
      0% {
        transform: translateX(-50%) skewX(20deg) scale(0);
      }

      100% {
        transform: translateX(-50%) skewX(20deg) scale(1);
      }
    }

    /* 5. Score Pulse (Triggered on update) */
    .score-pulse {
      animation: score-pop 0.3s ease-out;
    }

    @keyframes score-pop {
      0% {
        transform: scale(1);
        color: #fff;
      }

      50% {
        transform: scale(1.5);
        color: #ffff00;
        text-shadow: 0 0 20px yellow;
      }

      100% {
        transform: scale(1);
        color: #fff;
      }
    }

    /* 4. Entry Animation Class (Toggled by JS) */
    .enter-active {
      animation: slide-in 0.8s forwards cubic-bezier(0.16, 1, 0.3, 1);
    }

    .exit-active {
      animation: slide-out 0.5s forwards ease-in;
    }

    @keyframes slide-in {
      0% {
        transform: translate(-50%, -150%);
        opacity: 0;
      }

      100% {
        transform: translate(-50%, 0);
        opacity: 1;
      }
    }

    @keyframes slide-out {
      0% {
        transform: translate(-50%, 0);
        opacity: 1;
      }

      100% {
        transform: translate(-50%, -150%);
        opacity: 0;
      }
    }

    /* Game Type Indicator */
    .bo-indicator {
      position: absolute;
      bottom: -26px;
      left: 50%;
      /* Transform is handled by parent or specific animation context needed?
         Current structure has it absolute to #scoreboard.
         Let's keep transform but ensuring margins align.
      */
      transform: translateX(-50%) skewX(-20deg);
      margin-left: -11px;
      background: #000;
      color: #fff;
      padding: 3px 15px;
      font-size: 15px;
      font-weight: 700;
      border-bottom: 2px solid #edaf22;
      border-left: 2px solid #555;
      border-right: 2px solid #555;
      z-index: 5;
      white-space: nowrap;
      letter-spacing: 1px;
      min-width: 80px;
      text-align: center;
    }

    /* Multi-player Stack Styles - HORIZONTAL */
    .p1-content,
    .p2-content {
      flex-direction: row;
      /* Horizontal flow */
      align-items: center;
      gap: 15px;
      /* Spacing between players */
    }

    .p1-content {
      justify-content: flex-end;
    }

    .p2-content {
      justify-content: flex-start;
    }

    .player-entry {
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-bottom: 0;
      /* Entry Animation */
      animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      opacity: 0;
      transform: scale(0.8);
    }

    /* Staggered animation delays handled in JS or via nth-child if static count */
    .player-entry:nth-child(1) {
      animation-delay: 0.1s;
    }

    .player-entry:nth-child(2) {
      animation-delay: 0.2s;
    }

    .player-entry:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes pop-in {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* 2v2 Adjustments */
    .team-size-2 .player-name {
      font-size: 22px;
    }

    .team-size-2 .leader-name {
      font-size: 14px;
    }

    /* 3v3 Adjustments - Horizontal space is precious */
    .team-size-3 .player-name {
      font-size: 18px;
      line-height: 1.1;
    }

    .team-size-3 .leader-name {
      font-size: 12px;
    }

    /* ============ Map Popup ============ */
    .map-popup {
      position: fixed;
      top: 50%;
      right: 100px;
      transform: translateY(-50%) translateX(60px);
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 8px 24px;
      color: #fff;
      font-family: 'Rajdhani', 'Segoe UI', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      z-index: 100;
      opacity: 0;
    }

    /* --- Enter: slide in from right --- */
    .map-popup.enter {
      animation: map-enter var(--map-enter-dur, 3s) cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* --- Idle: breathing glow + float --- */
    .map-popup.idle {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
      animation: map-float 3s ease-in-out infinite alternate,
        map-glow 2s ease-in-out infinite alternate;
    }

    /* --- Exit: slide out to right --- */
    .map-popup.exit {
      animation: map-exit var(--map-exit-dur, 3s) ease-in forwards;
    }

    @keyframes map-enter {
      0% {
        opacity: 0;
        transform: translateY(-50%) translateX(60px) scale(0.9);
      }

      60% {
        opacity: 1;
        transform: translateY(-50%) translateX(-8px) scale(1.02);
      }

      100% {
        opacity: 1;
        transform: translateY(-50%) translateX(0) scale(1);
      }
    }

    @keyframes map-exit {
      0% {
        opacity: 1;
        transform: translateY(-50%) translateX(0) scale(1);
      }

      40% {
        opacity: 0.8;
        transform: translateY(-50%) translateX(-10px) scale(1.01);
      }

      100% {
        opacity: 0;
        transform: translateY(-50%) translateX(80px) scale(0.9);
      }
    }

    @keyframes map-float {
      0% {
        transform: translateY(-50%) translateX(0);
      }

      100% {
        transform: translateY(calc(-50% - 4px)) translateX(0);
      }
    }

    @keyframes map-glow {
      0% {
        border-color: rgba(255, 255, 255, 0.15);
        text-shadow: 0 0 4px rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.05);
      }

      100% {
        border-color: rgba(255, 255, 255, 0.5);
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.6);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
      }
    }

    .score-num {
      font-size: 42px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    /* Border burst glow overlay */
    .border-burst {
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border: 3px solid var(--team-color, #fff);
      opacity: 0;
      pointer-events: none;
      z-index: 12;
      filter: blur(2px);
    }

    /* Team Name Label (Toggleable) - Optimized Size */
    .team-name-label {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 2px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      padding-bottom: 1px;
      display: inline-block;
    }

    /* ============ Disconnect Alert ============ */
    .disconnect-alert {
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%) skewX(-20deg);
      background: linear-gradient(135deg, #cc0000, #ff2222, #cc0000);
      color: #fff;
      padding: 5px 30px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 60;
      border: 2px solid #ff4444;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6), 0 0 40px rgba(255, 0, 0, 0.3);
      opacity: 0;
      pointer-events: none;
    }

    .disconnect-alert .dc-text {
      display: inline-block;
      transform: skewX(20deg);
    }

    .disconnect-alert.active {
      animation: dc-pulse 1.5s ease-in-out infinite;
    }

    @keyframes dc-pulse {

      0%,
      100% {
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.5), 0 0 30px rgba(255, 0, 0, 0.2);
        border-color: #ff4444;
      }

      50% {
        box-shadow: 0 0 30px rgba(255, 0, 0, 0.8), 0 0 60px rgba(255, 0, 0, 0.4), 0 0 10px #fff;
        border-color: #ff8888;
      }
    }

    /* ============ Game Over Alert ============ */
    .game-over-alert {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) skewX(-20deg) scale(0);
      background: linear-gradient(135deg, #b8860b, #ffd700, #b8860b);
      color: #000;
      padding: 15px 60px;
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 100;
      border: 4px solid #fff;
      box-shadow: 0 0 50px rgba(255, 215, 0, 0.8), 0 0 100px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
    }

    /* ============ Mirror Match Alert ============ */
    .mirror-match-alert {
      position: absolute;
      top: 100%;
      margin-top: 20px;
      margin-left: -15px;
      left: 50%;
      transform: translate(-50%, 0) skewX(-20deg);
      background: linear-gradient(135deg, #c0c0c0, #e0ffff, #c0c0c0);
      color: #000;
      padding: 4px 15px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 100;
      border: 2px solid #00ffff;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.6), 0 0 30px rgba(255, 255, 255, 0.4);
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .mirror-match-alert.active {
      opacity: 1;
      pointer-events: auto;
      animation: mm-pulse 1.5s ease-in-out infinite;
    }

    @keyframes mm-pulse {

      0%,
      100% {
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.6), 0 0 30px rgba(255, 255, 255, 0.4);
        border-color: #00ffff;
        background: linear-gradient(135deg, #c0c0c0, #e0ffff, #c0c0c0);
      }

      50% {
        box-shadow: 0 0 25px rgba(0, 255, 255, 0.9), 0 0 50px rgba(0, 255, 255, 0.6), 0 0 15px #fff;
        border-color: #e0ffff;
        background: linear-gradient(135deg, #e0ffff, #ffffff, #e0ffff);
      }
    }
  </style>
</head>

<body>

  <div id="scoreboard" class="dynamic-pulse">
    <!-- Pulse Wave Element -->
    <div class="pulse-wave-wrapper">
      <div class="pulse-wave"></div>
      <div class="pulse-wave"></div>
    </div>



    <!-- Player 1 / Team 1 Side -->
    <div class="block p1-side border-traced" id="p1-block" style="--team-color: #cc2222;">
      <!-- Winner Label P1 -->
      <div class="winner-label">SERIES WINNER</div>
      <!-- SVG Border Trace -->
      <svg class="border-trace-svg" preserveAspectRatio="none">
        <rect class="border-trace-rect" x="1" y="1" rx="0" ry="0" />
      </svg>
      <!-- Border Burst Glow -->
      <div class="border-burst"></div>
      <div class="content p1-content" id="t1-container">
        <!-- Dynamic Content -->
      </div>
      <!-- P1 History -->
      <div id="p1-history" class="team-history"></div>
    </div>

    <!-- P1 Score Block -->
    <div class="block score-block border-traced" id="p1-score-block" style="--team-color: #cc2222;">
      <!-- SVG Border Trace -->
      <svg class="border-trace-svg" preserveAspectRatio="none">
        <rect class="border-trace-rect" x="1" y="1" rx="0" ry="0" />
      </svg>
      <!-- Border Burst Glow -->
      <div class="border-burst"></div>
      <div class="content">
        <div class="score-num" id="p1-score">0</div>
      </div>
    </div>

    <!-- Gap for Timer -->
    <div class="timer-gap"></div>

    <!-- Game Type Floating Indicator -->
    <div class="bo-indicator glow-border">
      <span style="display:inline-block; transform: skewX(20deg);" id="game-type">DEATHMATCH</span>
    </div>

    <!-- P2 Score Block -->
    <div class="block score-block border-traced" id="p2-score-block" style="--team-color: #2244cc;">
      <!-- SVG Border Trace -->
      <svg class="border-trace-svg" preserveAspectRatio="none">
        <rect class="border-trace-rect" x="1" y="1" rx="0" ry="0" />
      </svg>
      <!-- Border Burst Glow -->
      <div class="border-burst"></div>
      <div class="content">
        <div class="score-num" id="p2-score">0</div>
      </div>
    </div>

    <!-- Player 2 / Team 2 Side -->
    <div class="block p2-side border-traced" id="p2-block" style="--team-color: #2244cc;">
      <!-- Winner Label P2 -->
      <div class="winner-label">SERIES WINNER</div>
      <!-- SVG Border Trace -->
      <svg class="border-trace-svg" preserveAspectRatio="none">
        <rect class="border-trace-rect" x="1" y="1" rx="0" ry="0" />
      </svg>
      <!-- Border Burst Glow -->
      <div class="border-burst"></div>
      <div class="content p2-content" id="t2-container">
        <!-- Dynamic Content -->
      </div>
      <!-- P2 History -->
      <div id="p2-history" class="team-history"></div>
    </div>

    <!-- Disconnect Alert -->
    <div id="disconnect-alert" class="disconnect-alert">
      <span class="dc-text">⚠ DISCONNECTION ⚠</span>
    </div>

    <!-- Game Over Alert -->
    <div id="game-over-alert" class="game-over-alert">
      GAME OVER
    </div>

    <!-- Mirror Match Alert -->
    <div id="mirror-match-alert" class="mirror-match-alert">
      MIRROR MATCH
    </div>
  </div>

  <!-- Map Popup -->
  <div id="map-popup" class="map-popup"></div>

  <script>
    const scoreboard = document.getElementById('scoreboard');
    let isVisible = false;
    let ws;
    let reconnectInterval = 3000;
    let lastDataStr = "";
    let prevP1Score = -1;
    let prevP2Score = -1;
    let currentMapName = '';
    let mapPopupTimer = null;
    let mapPopupEnabled = true;
    let prevHistoryState = []; // Track previous match winners for flash detection
    let mapEnterMs = 3000;
    let mapVisibleMs = 25000;
    let mapExitMs = 3000;
    let mapHiddenMs = 20000;
    let prevDisconnection = false;

    // ===== SVG Border Trace Animation =====
    const TRACE_SPEED_PPS = 80; // pixels per second – slowed down from 200

    function initBorderTraces() {
      document.querySelectorAll('.border-traced').forEach(block => {
        const svg = block.querySelector('.border-trace-svg');
        const rect = block.querySelector('.border-trace-rect');
        if (!svg || !rect) return;

        const sw = 3; // stroke-width
        const half = sw / 2;

        // Size the SVG and rect to cover the full border area (including the CSS border)
        function sizeRect() {
          // Include the 2px CSS border on each side
          const w = block.offsetWidth + 4;
          const h = block.offsetHeight + 4;
          svg.setAttribute('width', w);
          svg.setAttribute('height', h);
          svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
          rect.setAttribute('x', half);
          rect.setAttribute('y', half);
          rect.setAttribute('width', Math.max(w - sw, 1));
          rect.setAttribute('height', Math.max(h - sw, 1));
        }
        sizeRect();
        new ResizeObserver(sizeRect).observe(block);

        // Continuous dash animation with GSAP – speed-normalized
        const perimeter = () => 2 * ((block.offsetWidth + 4) + (block.offsetHeight + 4));
        const p = perimeter();
        const duration = p / TRACE_SPEED_PPS; // seconds = pixels / (pixels/second)

        gsap.to(rect, {
          strokeDashoffset: () => -perimeter(),
          duration: duration,
          ease: 'none',
          repeat: -1
        });
      });
    }

    function triggerBorderBurst(blockId) {
      const block = document.getElementById(blockId);
      if (!block) return;
      const rect = block.querySelector('.border-trace-rect');
      const burst = block.querySelector('.border-burst');

      // Flash the SVG stroke brighter and faster
      if (rect) {
        gsap.to(rect, {
          attr: { 'stroke-width': 6 },
          duration: 0.15,
          yoyo: true,
          repeat: 3,
          ease: 'power2.inOut',
          onComplete: () => gsap.set(rect, { attr: { 'stroke-width': 3 } })
        });
        // Temporarily tighten dash for a fast sweep
        gsap.to(rect, {
          strokeDasharray: '40 10',
          duration: 0.3,
          yoyo: true,
          repeat: 1,
          ease: 'power2.inOut',
          onComplete: () => gsap.set(rect, { strokeDasharray: '20 40' })
        });
      }

      // Glow burst on the border overlay
      if (burst) {
        gsap.fromTo(burst,
          { opacity: 0.9 },
          { opacity: 0, duration: 0.8, ease: 'power2.out' }
        );
      }
    }

    // ===== WebSocket =====
    function connect() {
      ws = new WebSocket('ws://localhost:7305');

      ws.onopen = () => {
        console.log("Connected");
        reconnectInterval = 3000;
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'update_score') {
          const currentDataStr = JSON.stringify(msg.data);
          const forceUpdate = (currentDataStr !== lastDataStr);
          lastDataStr = currentDataStr;

          updateData(msg.data, forceUpdate);

          if (!isVisible) showAnimate();
          triggerScorePulse();
        } else if (msg.type === 'game_over') {
          triggerGameOver();
        }
        /* mirror_match is now state-based in updateData, not event-based */
      };

      ws.onclose = () => {
        setTimeout(connect, reconnectInterval);
      };
      ws.onerror = (err) => ws.close();
    }

    connect();

    // Initialize border traces after first render
    setTimeout(initBorderTraces, 100);

    function updateData(data, forceUpdate) {
      // Scores
      const p1Score = parseInt(data.p1.score);
      const p2Score = parseInt(data.p2.score);
      document.getElementById('p1-score').innerText = p1Score;
      document.getElementById('p2-score').innerText = p2Score;

      // Detect individual score changes and trigger border burst
      if (prevP1Score >= 0 && p1Score !== prevP1Score) {
        triggerBorderBurst('p1-score-block');
      }
      if (prevP2Score >= 0 && p2Score !== prevP2Score) {
        triggerBorderBurst('p2-score-block');
      }
      prevP1Score = p1Score;
      prevP2Score = p2Score;

      // Game Type
      let gameType = data.game_type || "DEATHMATCH";
      document.getElementById('game-type').innerText = gameType.toUpperCase();

      // Series Winner Logic
      const bestOf = parseInt(data.best_of) || 1;
      const winsNeeded = Math.ceil(bestOf / 2);

      const p1Block = document.getElementById('p1-block');
      const p2Block = document.getElementById('p2-block');

      // Reset
      p1Block.classList.remove('series-win');
      p2Block.classList.remove('series-win');

      if (bestOf > 1) { // Only show for series
        if (p1Score >= winsNeeded) {
          p1Block.classList.add('series-win');
        } else if (p2Score >= winsNeeded) {
          p2Block.classList.add('series-win');
        }
      }

      // Render Match History
      renderHistory(data);

      // Render Teams - Only re-render DOM if something changed to allow animations to play smoothly or if forced
      // For simplicity in this tool, we re-render to ensure latest names/leaders. 
      // The CSS animation 'pop-in' will trigger on new elements.
      const teamSize = data.team_size || 1;
      renderTeam(1, data, teamSize);
      renderTeam(2, data, teamSize);

      // Update Map Popup config
      const mp = data.map_popup || {};
      const newEnabled = mp.enabled !== false;
      const newEnter = (mp.enter_sec || 3) * 1000;
      const newVisible = (mp.visible_sec || 25) * 1000;
      const newExit = (mp.exit_sec || 3) * 1000;
      const newHidden = (mp.hidden_sec || 20) * 1000;
      const mapName = data.current_map || '';

      const configChanged = (newEnabled !== mapPopupEnabled ||
        newEnter !== mapEnterMs || newVisible !== mapVisibleMs ||
        newExit !== mapExitMs || newHidden !== mapHiddenMs);

      mapPopupEnabled = newEnabled;
      mapEnterMs = newEnter;
      mapVisibleMs = newVisible;
      mapExitMs = newExit;
      mapHiddenMs = newHidden;

      if (mapName !== currentMapName || configChanged) {
        currentMapName = mapName;
        const popup = document.getElementById('map-popup');
        popup.textContent = mapName ? 'Current Map: ' + mapName : '';
        restartMapPopupCycle();
      }

      // Disconnect Alert
      const dcActive = !!data.disconnection;
      const dcEl = document.getElementById('disconnect-alert');
      if (dcActive && !prevDisconnection) {
        // Show with animation
        dcEl.classList.add('active');
        gsap.fromTo(dcEl,
          { opacity: 0, y: -20, scale: 0.8 },
          { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(1.7)' }
        );
      } else if (!dcActive && prevDisconnection) {
        // Hide with animation
        gsap.to(dcEl, {
          opacity: 0, y: -20, scale: 0.8, duration: 0.3, ease: 'power2.in',
          onComplete: () => dcEl.classList.remove('active')
        });
      }
      prevDisconnection = dcActive;

      // Mirror Match Alert (Persistent)
      const mmActive = !!data.mirror_match;
      const mmEl = document.getElementById('mirror-match-alert');
      if (mmActive) {
        mmEl.classList.add('active');
        // Optional: Pulse animation or similar could go here if we wanted more than static
      } else {
        mmEl.classList.remove('active');
      }
    }

    function triggerGameOver() {
      const goEl = document.getElementById('game-over-alert');
      // Entrance
      gsap.fromTo(goEl,
        { scale: 0, opacity: 0, rotation: -5 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.8, ease: 'elastic.out(1, 0.3)' }
      );

      // Auto-exit after 5 seconds
      gsap.to(goEl, {
        scale: 1.5, opacity: 0, duration: 0.5, ease: 'power2.in', delay: 5
      });
    }

    function renderHistory(data) {
      const p1Container = document.getElementById('p1-history');
      const p2Container = document.getElementById('p2-history');
      p1Container.innerHTML = '';
      p2Container.innerHTML = '';

      const bestOf = data.best_of || 1;
      const matches = data.matches || [];

      for (let i = 0; i < bestOf; i++) {
        // Determine status for this match index
        let p1Status = 'tbd';
        let p2Status = 'tbd';
        let isNew = false;

        if (i < matches.length) {
          const m = matches[i];
          if (m.winner === 1) {
            p1Status = 'win';
            p2Status = 'loss';
          } else if (m.winner === 2) {
            p1Status = 'loss';
            p2Status = 'win';
          }
          // Check if this result is new compared to previous state
          const prevWinner = prevHistoryState[i] || 0;
          if (m.winner !== 0 && m.winner !== prevWinner) {
            isNew = true;
          }
        }

        // Create P1 Indicator
        const p1Ind = document.createElement('div');
        p1Ind.className = `h-ind ${p1Status}${isNew ? ' flash' : ''}`;
        if (isNew) {
          p1Ind.addEventListener('animationend', function () {
            this.classList.remove('flash');
          }, { once: true });
        }
        p1Container.appendChild(p1Ind);

        // Create P2 Indicator
        const p2Ind = document.createElement('div');
        p2Ind.className = `h-ind ${p2Status}${isNew ? ' flash' : ''}`;
        if (isNew) {
          p2Ind.addEventListener('animationend', function () {
            this.classList.remove('flash');
          }, { once: true });
        }
        p2Container.appendChild(p2Ind);
      }

      // Save current state for next comparison
      prevHistoryState = matches.map(m => m.winner || 0);
    }

    function renderTeam(teamNum, data, size) {
      const container = document.getElementById(teamNum === 1 ? 't1-container' : 't2-container');

      // We want to avoid full clear if possible to keep existing anims? 
      // Actually user WANTS animation on update/add. So clearing and re-adding triggers the CSS animation.
      container.innerHTML = '';

      // Apply size class for CSS scaling
      container.className = `content ${teamNum === 1 ? 'p1-content' : 'p2-content'} team-size-${size}`;

      // Team Name (if enabled)
      const showTeamNames = data.show_team_names !== false;
      const teamName = teamNum === 1 ? (data.team1_name || '') : (data.team2_name || '');
      if (showTeamNames && teamName) {
        const tnDiv = document.createElement('div');
        tnDiv.className = 'team-name-label';
        tnDiv.innerText = teamName.toUpperCase();
        container.appendChild(tnDiv);
      }

      // Define player indices
      let indices = [];
      if (teamNum === 1) {
        indices = [1];
        if (size >= 2) indices.push(3);
        if (size >= 3) indices.push(5);
      } else {
        indices = [2];
        if (size >= 2) indices.push(4);
        if (size >= 3) indices.push(6);
      }

      indices.forEach(idx => {
        const pKey = `p${idx}`;
        const pData = data[pKey];
        if (!pData) return;

        let leaderName = pData.leader;
        if (data.current_match) {
          const matchLeaderKey = `p${idx}_leader`;
          if (data.current_match[matchLeaderKey]) {
            leaderName = data.current_match[matchLeaderKey];
          }
        }

        const entryDiv = document.createElement('div');
        entryDiv.className = 'player-entry';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'player-name';

        // Flag
        if (pData.country && pData.country !== 'xx') {
          const flagSpan = document.createElement('span');
          flagSpan.className = `fi fi-${pData.country}`;
          nameDiv.appendChild(flagSpan);
        }

        const nameText = document.createTextNode(pData.name.toUpperCase());
        nameDiv.appendChild(nameText);

        const leaderDiv = document.createElement('div');
        leaderDiv.className = 'leader-name';
        leaderDiv.innerText = leaderName.toUpperCase();

        // Player color bar
        const colorBar = document.createElement('div');
        colorBar.className = 'player-color-bar';
        const pColor = pData.color || '#fff';
        colorBar.style.background = pColor;
        colorBar.style.color = pColor; // for currentColor in glow


        entryDiv.appendChild(nameDiv);
        entryDiv.appendChild(leaderDiv);
        entryDiv.appendChild(colorBar);
        container.appendChild(entryDiv);
      });
    }

    function showAnimate() {
      isVisible = true;
      scoreboard.style.visibility = 'visible';
      scoreboard.classList.remove('exit-active');
      scoreboard.classList.add('enter-active');
    }

    function hideAnimate() {
      isVisible = false;
      scoreboard.classList.remove('enter-active');
      scoreboard.classList.add('exit-active');
    }

    function triggerScorePulse() {
      const scores = document.querySelectorAll('.score-num');
      scores.forEach(el => {
        el.classList.remove('score-pulse');
        void el.offsetWidth; // Trigger reflow
        el.classList.add('score-pulse');
      });
    }

    /* ---- Map Popup Cycle ---- */
    function restartMapPopupCycle() {
      clearTimeout(mapPopupTimer);
      const popup = document.getElementById('map-popup');
      if (!currentMapName || !mapPopupEnabled) { popup.className = 'map-popup'; return; }
      // Set CSS custom properties for animation durations
      popup.style.setProperty('--map-enter-dur', mapEnterMs + 'ms');
      popup.style.setProperty('--map-exit-dur', mapExitMs + 'ms');
      showMapPopup();
    }

    function showMapPopup() {
      if (!mapPopupEnabled) return;
      const popup = document.getElementById('map-popup');
      // Phase 1: Enter
      popup.className = 'map-popup enter';
      mapPopupTimer = setTimeout(() => {
        // Phase 2: Idle (breathing + float)
        popup.className = 'map-popup idle';
        mapPopupTimer = setTimeout(() => {
          // Phase 3: Exit
          popup.className = 'map-popup exit';
          mapPopupTimer = setTimeout(() => {
            // Phase 4: Hidden
            popup.className = 'map-popup';
            mapPopupTimer = setTimeout(showMapPopup, mapHiddenMs);
          }, mapExitMs);
        }, mapVisibleMs);
      }, mapEnterMs);
    }
  </script>
</body>

</html>
