<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>HW2 Score Overlay</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@6.6.6/css/flag-icons.min.css" />
  <link rel="stylesheet" id="main-style" href="src/css/score.css?v=20260308">
</head>

<body>
  <div id="scoreboard">
    <div class="block p1-side" id="p1-block" style="--team-color: #cc2222;">
      <div class="winner-label">SERIES WINNER</div>
      <div class="content p1-content" id="t1-container"></div>
      <div id="p1-history" class="team-history"></div>
    </div>
    <div class="block score-block" id="p1-score-block" style="--team-color: #cc2222; overflow: hidden;">
      <div class="pulse-overlay" id="p1-pulse-overlay">
        <div class="pulse-circle"></div>
      </div>
      <div class="content">
        <div class="score-num" id="p1-score">0</div>
      </div>
    </div>
    <div class="timer-gap">
      <div class="bo-indicator glow-border">
        <span style="display:inline-block; transform: skewX(20deg);" id="game-type">DEATHMATCH</span>
      </div>
    </div>
    <div class="block score-block" id="p2-score-block" style="--team-color: #2244cc; overflow: hidden;">
      <div class="pulse-overlay" id="p2-pulse-overlay">
        <div class="pulse-circle"></div>
      </div>
      <div class="content">
        <div class="score-num" id="p2-score">0</div>
      </div>
    </div>
    <div class="block p2-side" id="p2-block" style="--team-color: #2244cc;">
      <div class="winner-label">SERIES WINNER</div>
      <div class="content p2-content" id="t2-container"></div>
      <div id="p2-history" class="team-history"></div>
    </div>
    <div id="disconnect-alert" class="disconnect-alert"><span class="dc-text">⚠ DISCONNECTION ⚠</span></div>
    <div id="mirror-match-alert" class="mirror-match-alert">MIRROR MATCH</div>
  </div>
  <div id="map-popup" class="map-popup"></div>
  <script id="main-script" src="src/js/score.js"></script>
</body>

</html>
